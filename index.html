<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Panggilan Jemput Siswa PRO</title>
    
    <!-- Font Modern (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icon Modern Monokromatik (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* === TEMA & WARNA === */
        :root {
            --primary: #2563eb; /* Biru Elegan */
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color);
            min-height: 100vh; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }

        .card {
            background: var(--card-bg); width: 100%; max-width: 700px;
            padding: 35px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
        }

        /* HEADER */
        .header-title { display: flex; align-items: center; gap: 12px; color: var(--text-main); font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .header-title i { color: var(--primary); font-size: 28px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        /* KOTAK STATUS */
        #status-box {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 15px; border-radius: 8px; font-weight: 500; margin-bottom: 25px;
            font-size: 13px; border: 1px solid var(--border); background: #f8fafc; color: var(--text-muted);
        }
        .status-sukses { background: #ecfdf5 !important; color: var(--success) !important; border-color: #a7f3d0 !important; }
        .status-sukses i { color: var(--success); }

        /* INPUT GROUP (NIS & PENCARIAN) */
        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        
        .input-box { position: relative; display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-size: 13px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 6px;}
        
        .input-wrapper { display: flex; gap: 8px; position: relative; }
        .input-wrapper input {
            width: 100%; padding: 12px 15px; font-size: 15px;
            border: 1px solid var(--border); border-radius: 8px; transition: 0.2s;
            background: #f8fafc;
        }
        .input-wrapper input:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn-panggil {
            background: var(--primary); color: white; border: none; padding: 0 20px;
            border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-weight: 600;
        }
        .btn-panggil:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-panggil:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* LIVE SEARCH DROPDOWN */
        #searchResults {
            position: absolute; top: 100%; left: 0; right: 0; margin-top: 5px;
            background: white; border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 10; max-height: 250px; overflow-y: auto;
            display: none;
        }
        .search-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border-bottom: 1px solid var(--border); transition: 0.2s;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: #f1f5f9; }
        .search-info { display: flex; flex-direction: column; }
        .search-nama { font-weight: 600; font-size: 14px; color: var(--text-main); }
        .search-detail { font-size: 12px; color: var(--text-muted); }
        .btn-add { background: #e0e7ff; color: var(--primary); border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-add:hover { background: var(--primary); color: white; }

        /* TOMBOL STOP */
        .btn-stop {
            width: 100%; background: #fee2e2; color: var(--danger); border: 1px solid #fecaca;
            padding: 12px; font-size: 14px; font-weight: 600; border-radius: 8px;
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 25px;
        }
        .btn-stop:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* ANTREAN & RIWAYAT */
        .container-bawah { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box-list { border: 1px solid var(--border); border-radius: 12px; height: 320px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column;}
        .box-header { 
            padding: 15px; border-bottom: 1px solid var(--border); background: white;
            position: sticky; top: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--text-main);
        }
        
        ul { list-style: none; padding: 10px; }
        li {
            background: white; padding: 12px; margin-bottom: 8px;
            border-radius: 8px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .li-antrean { border-left: 4px solid var(--primary); }
        .li-riwayat { border-left: 4px solid var(--success); opacity: 0.8; }
        
        .info-siswa { display: flex; flex-direction: column; flex: 1; margin-right: 10px; }
        .nama-siswa { font-weight: 600; font-size: 13px; color: var(--text-main); }
        .detail-siswa { font-size: 11px; color: var(--text-muted); margin-top: 2px;}
        
        .btn-batal { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .btn-batal:hover { background: var(--danger); color: white; }

        /* TOAST NOTIFIKASI */
        #toast {
            visibility: hidden; min-width: 250px; background-color: var(--text-main); color: white;
            text-align: center; border-radius: 8px; padding: 15px; position: fixed;
            z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0; transition: 0.3s;
            font-weight: 500; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        #toast.show { visibility: visible; opacity: 1; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* RESPONSIVE UNTUK HP */
        @media (max-width: 600px) {
            .input-section { grid-template-columns: 1fr; gap: 15px; }
            .container-bawah { grid-template-columns: 1fr; }
            .box-list { height: 250px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">
            <i class="ph-fill ph-speaker-hifi"></i> Sistem Panggilan Siswa
        </div>
        <p class="subtitle">Modul otomatisasi penjemputan dengan output suara terintegrasi</p>

        <div id="status-box">
            <i class="ph ph-spinner ph-spin"></i> Menghubungkan ke Database Sheets...
        </div>
        
        <div class="input-section">
            <!-- Panggil via NIS -->
            <div class="input-box">
                <label><i class="ph ph-identification-card"></i> Panggil via NIS</label>
                <div class="input-wrapper">
                    <input type="text" id="nisInput" placeholder="Ketik NIS..." autocomplete="off">
                    <button class="btn-panggil" id="btnPanggil" onclick="panggil(document.getElementById('nisInput').value)" disabled>
                        <i class="ph-bold ph-megaphone"></i>
                    </button>
                </div>
            </div>

            <!-- Cari Data Siswa -->
            <div class="input-box">
                <label><i class="ph ph-magnifying-glass"></i> Cari Data Siswa</label>
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="Ketik Nama / Kelas..." autocomplete="off">
                    <!-- Dropdown Hasil Pencarian -->
                    <div id="searchResults"></div>
                </div>
            </div>
        </div>
        
        <button class="btn-stop" onclick="hentikanSuara()">
            <i class="ph-fill ph-stop-circle"></i> Hentikan Suara Saat Ini
        </button>
        
        <div class="container-bawah">
            <div class="box-list">
                <div class="box-header"><i class="ph-fill ph-list-numbers" style="color: var(--primary);"></i> Daftar Antrean</div>
                <ul id="daftarAntrean"><li style="color: #999; justify-content:center; font-size:13px;">Antrean kosong</li></ul>
            </div>
            <div class="box-list">
                <div class="box-header"><i class="ph-fill ph-clock-counter-clockwise" style="color: var(--success);"></i> Riwayat Panggilan</div>
                <ul id="daftarRiwayat"><li style="color: #999; justify-content:center; font-size:13px;">Belum ada riwayat</li></ul>
            </div>
        </div>
    </div>

    <div id="toast"><i class="ph-fill ph-info"></i> <span id="toast-msg">Notifikasi</span></div>

    <script>
        const urlGoogleSheets = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQnDyG3NAgbwsdmq_T47f_iXMjBeOT4EXVLEhjwarsaWd-ZQtjprjoJUKh3yeau7LO-bgAZgLXivQKh/pub?gid=0&single=true&output=csv";
        
        let dataSiswa = {}; 
        let antrean = [];
        let riwayat = [];
        let sedangProses = false;
        let batalPaksa = false; 

        // DETEKSI SUARA BROWSER
        let daftarSuara = [];
        window.speechSynthesis.onvoiceschanged = function() {
            daftarSuara = window.speechSynthesis.getVoices();
        };

        // FUNGSI NOTIFIKASI
        function tampilkanNotif(pesan, icon = "ph-info") {
            let toast = document.getElementById("toast");
            toast.innerHTML = `<i class="ph-fill ${icon}" style="font-size: 20px;"></i> <span>${pesan}</span>`;
            toast.classList.add("show");
            setTimeout(function(){ toast.classList.remove("show"); }, 3000);
        }

        // FETCH DATA GOOGLE SHEETS
        async function ambilDataSiswa() {
            const statusBox = document.getElementById("status-box");
            try {
                const response = await fetch(urlGoogleSheets);
                if (!response.ok) throw new Error("Gagal");
                const dataText = await response.text();
                const baris = dataText.split('\n');
                
                for (let i = 1; i < baris.length; i++) {
                    let kolom = baris[i].split(','); 
                    if (kolom.length >= 3) {
                        let nis = kolom[0].trim();
                        let nama = kolom[1].trim();
                        let kelas = kolom[2].trim();
                        
                        if(nis !== "") {
                            dataSiswa[nis] = { nama: nama, kelas: kelas };
                        }
                    }
                }
                statusBox.innerHTML = `<i class="ph-fill ph-check-circle"></i> Database Terhubung (${Object.keys(dataSiswa).length} Data)`;
                statusBox.className = "status-sukses";
                document.getElementById("btnPanggil").disabled = false;
                
                daftarSuara = window.speechSynthesis.getVoices();
            } catch (error) {
                statusBox.innerHTML = `<i class="ph-fill ph-warning-circle"></i> Gagal koneksi ke database.`;
                statusBox.style.color = "var(--danger)";
            }
        }
        ambilDataSiswa();

        // FITUR LIVE SEARCH
        document.getElementById("searchInput").addEventListener("input", function() {
            let keyword = this.value.toLowerCase().trim();
            let resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = "";
            
            if (keyword.length < 2) {
                resultsDiv.style.display = "none";
                return;
            }
            
            let matched = Object.entries(dataSiswa).filter(([nis, data]) => {
                return data.nama.toLowerCase().includes(keyword) || data.kelas.toLowerCase().includes(keyword);
            });

            if (matched.length > 0) {
                resultsDiv.style.display = "block";
                // Batasi hanya menampilkan 10 hasil agar tidak kepanjangan
                matched.slice(0, 10).forEach(([nis, data]) => {
                    let div = document.createElement("div");
                    div.className = "search-item";
                    div.innerHTML = `
                        <div class="search-info">
                            <span class="search-nama">${data.nama}</span>
                            <span class="search-detail">NIS: ${nis} &bull; ${data.kelas}</span>
                        </div>
                        <button class="btn-add" onclick="panggilDariPencarian('${nis}')" title="Tambahkan ke antrean">
                            <i class="ph-bold ph-plus"></i>
                        </button>`;
                    resultsDiv.appendChild(div);
                });
            } else {
                resultsDiv.style.display = "block";
                resultsDiv.innerHTML = `<div class="search-item"><div class="search-info"><span class="search-detail">Data tidak ditemukan</span></div></div>`;
            }
        });

        // HILANGKAN DROPDOWN JIKA KLIK DI LUAR
        document.addEventListener('click', function(e) {
            if (!document.getElementById("searchInput").contains(e.target)) {
                document.getElementById("searchResults").style.display = "none";
            }
        });

        function panggilDariPencarian(nis) {
            document.getElementById("searchInput").value = "";
            document.getElementById("searchResults").style.display = "none";
            panggil(nis);
        }

        // FUNGSI BEL
        function mainkanBel() {
            return new Promise((resolve) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const mainkanNada = (frekuensi, waktuMulai, durasi) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(frekuensi, ctx.currentTime + waktuMulai);
                        gain.gain.setValueAtTime(0.6, ctx.currentTime + waktuMulai);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + waktuMulai + durasi);
                        osc.start(ctx.currentTime + waktuMulai);
                        osc.stop(ctx.currentTime + waktuMulai + durasi);
                    };
                    mainkanNada(783.99, 0, 1.2); 
                    mainkanNada(523.25, 0.6, 1.5); 
                    setTimeout(resolve, 2000); 
                } catch (e) { resolve(); }
            });
        }

        // FUNGSI MASUKKAN KE ANTREAN
        function panggil(nisValue) {
            let nis = nisValue.trim();
            let siswa = dataSiswa[nis];
            let inputElemen = document.getElementById("nisInput");

            if (siswa) {
                let teksBicara = "Panggilan kepada, " + siswa.nama + ", dari " + siswa.kelas + ". ditunggu di depan kantor sekretariatan.";
                
                antrean.push({ nis: nis, nama: siswa.nama, kelas: siswa.kelas, suara: teksBicara });
                updateUIAntrean();
                
                inputElemen.value = "";
                tampilkanNotif(`${siswa.nama} masuk antrean`, "ph-check-circle");
                prosesAntrean();
            } else {
                if(nis !== "") tampilkanNotif("NIS tidak ditemukan!", "ph-warning-circle");
                inputElemen.value = "";
            }
            inputElemen.focus();
        }

        document.getElementById("nisInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") panggil(this.value);
        });

        function batalkanAntrean(index) {
            let batal = antrean.splice(index, 1);
            tampilkanNotif("Antrean dibatalkan", "ph-trash");
            updateUIAntrean();
        }

        function hentikanSuara() {
            if (sedangProses) {
                batalPaksa = true;
                window.speechSynthesis.cancel();
                tampilkanNotif("Suara dihentikan", "ph-stop-circle");
            }
        }

        // SETTING SUARA NATURAL EDGE / GOOGLE
        function setupSuara(utterance) {
            utterance.lang = 'id-ID'; 
            utterance.rate = 0.85; 
            if (daftarSuara.length > 0) {
                let suaraPilihan = daftarSuara.find(v => 
                    (v.name.includes("Gadis") || v.name.includes("Natural") || v.name.includes("Ayu") || v.name.includes("Damayanti")) && v.lang.includes("id")
                );
                if(!suaraPilihan) suaraPilihan = daftarSuara.find(v => v.lang === 'id-ID');
                if (suaraPilihan) utterance.voice = suaraPilihan;
            }
        }

        // PROSES PEMANGGILAN
        async function prosesAntrean() {
            if (antrean.length > 0 && !sedangProses) {
                sedangProses = true;
                batalPaksa = false; 
                
                await mainkanBel(); 
                
                if(batalPaksa || antrean.length === 0) { 
                    if(antrean.length > 0) antrean.shift(); 
                    sedangProses = false;
                    updateUIAntrean();
                    setTimeout(prosesAntrean, 500); 
                    return; 
                }

                let dataSaatIni = antrean[0]; 
                let suara1 = new SpeechSynthesisUtterance(dataSaatIni.suara);
                let suara2 = new SpeechSynthesisUtterance(dataSaatIni.suara);
                
                setupSuara(suara1);
                setupSuara(suara2);

                let sudahSelesai = false;

                function selesaikanSuara() {
                    if (sudahSelesai) return;
                    sudahSelesai = true;

                    if (antrean.length > 0) {
                        let selesai = antrean.shift(); 
                        if (!batalPaksa && selesai) {
                            riwayat.unshift({ nis: selesai.nis, nama: selesai.nama, kelas: selesai.kelas }); 
                            if(riwayat.length > 15) riwayat.pop();
                            updateUIRiwayat();
                        }
                    }

                    sedangProses = false;
                    batalPaksa = false;
                    updateUIAntrean();
                    setTimeout(prosesAntrean, 500); 
                }

                suara1.onend = function() {
                    if (batalPaksa) { selesaikanSuara(); return; }
                    setTimeout(() => {
                        if (batalPaksa) { selesaikanSuara(); return; }
                        window.speechSynthesis.speak(suara2);
                    }, 1000); 
                };

                suara2.onend = selesaikanSuara;
                suara1.onerror = selesaikanSuara; 
                suara2.onerror = selesaikanSuara; 

                window.speechSynthesis.speak(suara1);
            }
        }

        // UPDATE UI TAMPILAN
        function updateUIAntrean() {
            let list = document.getElementById("daftarAntrean");
            list.innerHTML = "";
            if(antrean.length === 0) {
                list.innerHTML = '<li style="color: #999; justify-content:center; font-size:13px;">Antrean kosong</li>';
                return;
            }
            antrean.forEach((a, index) => {
                let li = document.createElement("li");
                li.className = "li-antrean";
                li.innerHTML = `
                    <div class="info-siswa">
                        <span class="nama-siswa">${a.nama}</span>
                        <span class="detail-siswa">NIS: ${a.nis} &bull; ${a.kelas}</span>
                    </div>
                    <button class="btn-batal" onclick="batalkanAntrean(${index})" title="Hapus dari antrean">
                        <i class="ph-bold ph-x"></i>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function updateUIRiwayat() {
            let list = document.getElementById("daftarRiwayat");
            list.innerHTML = "";
            if(riwayat.length === 0) {
                list.innerHTML = '<li style="color: #999; justify-content:center; font-size:13px;">Belum ada riwayat</li>';
                return;
            }
            riwayat.forEach((r) => {
                let li = document.createElement("li");
                li.className = "li-riwayat";
                li.innerHTML = `
                    <div class="info-siswa">
                        <span class="nama-siswa">${r.nama}</span>
                        <span class="detail-siswa">NIS: ${r.nis} &bull; ${r.kelas}</span>
                    </div>
                    <i class="ph-bold ph-check" style="color: var(--success); margin-right: 5px;"></i>
                `;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
